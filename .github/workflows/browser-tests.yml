name: Browser acceptance tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/smoke.spec.js --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-failure
          path: |
            test-results/
            *-mobile.png
